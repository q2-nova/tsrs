name: Build the Q2 network daemon
on:
  push:
    tags: ['v[0-9]*-rc.[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Read component versions
        id: lock
        run: |
          for component in q2-os q2-toolchain; do
            version=$(jq -er --arg k "$component" '.[$k]' release-lock.json)
            [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]
            echo "${component#q2-}=$version" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: q2-nova/q2-os
          ref: refs/tags/${{ steps.lock.outputs.os }}
          token: ${{ secrets.Q2_COMPONENTS_READ_TOKEN || github.token }}
          path: build/os-source
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: q2-nova/q2-toolchain
          ref: refs/tags/${{ steps.lock.outputs.toolchain }}
          token: ${{ secrets.Q2_COMPONENTS_READ_TOKEN || github.token }}
          path: build/compiler-source
          persist-credentials: false
      - name: Download the pinned release assets
        env:
          GH_TOKEN: ${{ secrets.Q2_COMPONENTS_READ_TOKEN || github.token }}
          OS_TAG: ${{ steps.lock.outputs.os }}
          COMPILER_TAG: ${{ steps.lock.outputs.toolchain }}
        run: |
          mkdir -p build/sdk-release build/compiler-release
          gh release download "$OS_TAG" -R q2-nova/q2-os -D build/sdk-release \
            -p mipsel-buildroot-linux-gnu_sdk-buildroot.tar.gz -p sdk-manifest.json -p sdk-test.json -p buildroot.config -p SHA256SUMS
          gh release download "$COMPILER_TAG" -R q2-nova/q2-toolchain -D build/compiler-release \
            -p compiler.tar.gz -p compiler.tar.gz.sha256
      - name: Verify, relocate and build
        run: bash ci/build-release.sh
      - name: Publish the tagged daemon
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          gh release create "$GITHUB_REF_NAME" tsrsd-q2.tar.gz tsrsd-q2.tar.gz.sha256 \
            third-party-source.tar.gz --verify-tag --prerelease --title "$GITHUB_REF_NAME" \
            --notes "Q2 network daemon. See release-lock.json at this tag for its SDK and compiler versions."
